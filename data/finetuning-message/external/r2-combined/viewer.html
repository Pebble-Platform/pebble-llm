<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R2 Suicide-Risk Dataset — Viewer</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e6e8ee; --mut:#9aa3b2; --acc:#6ea8fe;
    --l0:#4ea1ff; --l1:#ffcf5c; --l2:#ff8a5c; --l3:#ff5c7a;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt)}
  header{padding:20px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{margin:0 0 2px;font-size:18px}
  .sub{color:var(--mut);font-size:13px}
  .wrap{padding:20px 24px;max-width:1100px;margin:0 auto}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:120px}
  .card .n{font-size:22px;font-weight:700}
  .card .k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .bars{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:20px}
  .barrow{display:flex;align-items:center;gap:10px;margin:6px 0}
  .barrow .lab{width:90px;font-size:13px}
  .bar{height:18px;border-radius:4px;min-width:2px}
  .barrow .v{color:var(--mut);font-size:12px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
  input,select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
  input[type=search]{flex:1;min-width:200px}
  .pill{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;color:#0c0e12}
  .Indicator{background:var(--l0)} .Ideation{background:var(--l1)} .Behavior{background:var(--l2)} .Attempt{background:var(--l3)}
  .src{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
  .row:hover{border-color:var(--acc)}
  .rhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rid{color:var(--mut);font-size:12px;margin-left:auto}
  .snippet{color:var(--txt);margin-top:6px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .posts{margin-top:10px;display:none}
  .row.open .posts{display:block}
  .post{background:var(--panel2);border-left:3px solid var(--acc);border-radius:6px;padding:8px 10px;margin:6px 0;white-space:pre-wrap}
  .post .pi{color:var(--mut);font-size:11px;margin-bottom:3px}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:16px 0;color:var(--mut)}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  .note{color:var(--mut);font-size:12px;margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
  a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>R2 Suicide-Risk Dataset (C-SSRS 4-level)</h1>
  <div class="sub">Enriched set for the MentalRoBERTa dual-head reproduction · ordinal: Indicator → Ideation → Behavior → Attempt</div>
</header>
<div class="wrap">
  <div class="cards" id="cards"></div>
  <div class="bars" id="bars"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search text…">
    <select id="flabel"><option value="">All labels</option></select>
    <select id="fsrc"><option value="">All sources</option></select>
    <select id="fnposts"><option value="">Any length</option><option value="1">1 post</option><option value="2">2+ posts</option></select>
    <span id="count" class="sub"></span>
  </div>
  <div id="list"></div>
  <div class="pager">
    <button id="prev">‹ Prev</button><span id="pg"></span><button id="next">Next ›</button>
  </div>
  <div class="note" id="note">Loading…</div>
</div>
<script>
const LABELS=["Indicator","Ideation","Behavior","Attempt"];
const COL={Indicator:"var(--l0)",Ideation:"var(--l1)",Behavior:"var(--l2)",Attempt:"var(--l3)"};
const PER=25; let DATA=[], view=[], page=0;

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

function summary(){
  const bySrc={}, byLab={};
  for(const r of DATA){bySrc[r.source]=(bySrc[r.source]||0)+1; byLab[r.label]=(byLab[r.label]||0)+1;}
  const cards=document.getElementById("cards");
  cards.innerHTML=`<div class="card"><div class="n">${DATA.length.toLocaleString()}</div><div class="k">samples</div></div>`+
    Object.entries(bySrc).map(([s,n])=>`<div class="card"><div class="n">${n.toLocaleString()}</div><div class="k">${s}</div></div>`).join("");
  const max=Math.max(...LABELS.map(l=>byLab[l]||0));
  document.getElementById("bars").innerHTML="<b>Class distribution</b>"+LABELS.map(l=>{
    const n=byLab[l]||0, w=max?Math.round(n/max*100):0;
    return `<div class="barrow"><span class="lab">${l}</span><div class="bar" style="width:${w}%;background:${COL[l]}"></div><span class="v">${n.toLocaleString()}</span></div>`;
  }).join("");
  const fl=document.getElementById("flabel"); LABELS.forEach(l=>fl.add(new Option(l,l)));
  const fs=document.getElementById("fsrc"); Object.keys(bySrc).forEach(s=>fs.add(new Option(s,s)));
}

function applyFilters(){
  const q=document.getElementById("q").value.toLowerCase().trim();
  const fl=document.getElementById("flabel").value, fs=document.getElementById("fsrc").value, fn=document.getElementById("fnposts").value;
  view=DATA.filter(r=>{
    if(fl&&r.label!==fl) return false;
    if(fs&&r.source!==fs) return false;
    if(fn==="1"&&r.posts.length!==1) return false;
    if(fn==="2"&&r.posts.length<2) return false;
    if(q&&!r.posts.join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
  page=0; render();
}

function render(){
  const pages=Math.max(1,Math.ceil(view.length/PER));
  page=Math.min(page,pages-1);
  document.getElementById("count").textContent=`${view.length.toLocaleString()} match`;
  const slice=view.slice(page*PER,page*PER+PER);
  document.getElementById("list").innerHTML=slice.map(r=>`
    <div class="row" data-id="${r.id}">
      <div class="rhead">
        <span class="pill ${r.label}">${r.label}</span>
        <span class="src">${r.source}</span>
        <span class="sub">${r.posts.length} post${r.posts.length>1?"s":""}</span>
        <span class="rid">${r.id}</span>
      </div>
      <div class="snippet">${esc(r.posts[0]).slice(0,400)}</div>
      <div class="posts">${r.posts.map((p,i)=>`<div class="post"><div class="pi">post ${i+1}</div>${esc(p)}</div>`).join("")}</div>
    </div>`).join("") || `<div class="sub">No matches.</div>`;
  document.querySelectorAll(".row").forEach(el=>el.onclick=()=>el.classList.toggle("open"));
  document.getElementById("pg").textContent=`page ${page+1} / ${pages}`;
  document.getElementById("prev").disabled=page===0;
  document.getElementById("next").disabled=page>=pages-1;
}

document.getElementById("prev").onclick=()=>{page--;render();window.scrollTo(0,0)};
document.getElementById("next").onclick=()=>{page++;render();window.scrollTo(0,0)};
["q","flabel","fsrc","fnposts"].forEach(id=>document.getElementById(id).addEventListener("input",applyFilters));

fetch("sequences.json").then(r=>r.json()).then(d=>{
  DATA=d; view=d; summary(); render();
  document.getElementById("note").innerHTML=
    `Source: <code>r2-combined/sequences.json</code> (gitignored, mental-health PII). `+
    `Built by <code>scripts/r2_build_dataset.py</code>. Labels are clinical (CSSRS-500) / LLM-assisted (av9ash, scraped).`;
}).catch(e=>{
  document.getElementById("note").innerHTML=
    `<b>Could not load sequences.json.</b> Serve over HTTP from this folder:<br>`+
    `<code>cd data/finetuning-message/external/r2-combined && python3 -m http.server 8770</code> → open <a href="http://127.0.0.1:8770/viewer.html">http://127.0.0.1:8770/viewer.html</a>`;
});
</script>
</body>
</html>
