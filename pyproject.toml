[project]
name = "pebble-llm"
version = "0.1.0"
description = "Pebble emotion classifier — multi-task NeoBERT fine-tuning (Gemini Flash-Lite backup)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Engineering" }]

dependencies = [
    # core training
    "torch>=2.4",
    "transformers>=4.48",
    "datasets>=3.0",
    "accelerate>=1.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    # NeoBERT custom modeling code dependencies (GPU)
    # "xformers==0.0.28.post3",  # install on GPU hosts; see configs/model/neobert.yaml
    # "flash-attn",              # install on GPU hosts only
    # config + experiment tracking
    "omegaconf>=2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "wandb>=0.18",
    # annotation agreement metrics
    "krippendorff>=0.8",
    # serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
serving = [
    "onnx>=1.17",
    "onnxruntime>=1.19",
    "optimum>=1.23",
]
gemini = [
    "google-cloud-aiplatform>=1.70",
    "google-cloud-firestore>=2.19",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pebble_llm"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["pebble_llm"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=pebble_llm --cov-report=term-missing"
pythonpath = ["src"]
