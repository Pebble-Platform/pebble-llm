[project]
name = "pebble-llm"
version = "0.2.0"
description = "ViEmoSpeech — Vietnamese speech-emotion corpus + tone×emotion bimodal SER research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Engineering" }]

# NOTE: the extraction pipeline's heavy deps (torch/demucs/silero-vad/
# transformers/pyannote/soundfile) are deliberately NOT project dependencies —
# they live in the dedicated `.venv-vnser` (see scripts/vietnamese-ser/README.md)
# because they need a pinned, conflict-prone stack. This project env is for
# tooling + light analysis only.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
]

# ---------------------------------------------------------------------------
# Tooling — archive/ is frozen history, never linted
# ---------------------------------------------------------------------------
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts"]
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",              # line length handled by formatter
    "RUF001", "RUF002", "RUF003",  # Vietnamese text in strings/comments/docs is legit unicode
    "B905",              # zip strict= churn on verified pipeline code
    "E741", "RUF007",    # cosmetic; pipeline files are verification-locked
]
