<!doctype html>
<meta charset="utf-8">
<title>Chốt gold set — ViEmoSpeech</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bd:#d5d8dc; --mut:#6b7280; --acc:#2563eb; --ok:#16a34a; --no:#dc2626; }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 system-ui, "Segoe UI", sans-serif; margin: 0 auto; padding: 20px 16px 64px;
         max-width: 860px; color: #111; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .note { color: var(--mut); font-size: 13px; margin-bottom: 6px; }
  .note b { color: #111; }
  .head { position: sticky; top: 0; background: #fff; padding-bottom: 10px;
          border-bottom: 1px solid var(--bd); margin-bottom: 12px; z-index: 2; }
  .counts { font-size: 13px; color: var(--mut); margin-top: 8px; }
  .counts b { color: #111; }
  table { border-collapse: collapse; width: 100%; }
  td { border-bottom: 1px solid var(--bd); padding: 7px 6px; vertical-align: middle; }
  tr.cur td { background: #eff6ff; }
  tr.drop td { opacity: .42; }
  tr.drop td.emo { text-decoration: line-through; }
  td.emo { font-weight: 600; width: 118px; }
  td.key { color: var(--mut); font-size: 12px; font-family: ui-monospace, monospace; }
  td.act { width: 210px; text-align: right; white-space: nowrap; }
  button { cursor: pointer; border: 1px solid var(--bd); background: #fff; border-radius: 6px;
           padding: 6px 11px; font-size: 13px; }
  button:hover { border-color: var(--acc); }
  .play.heard { border-color: var(--ok); color: var(--ok); }
  .keep[data-on="1"] { background: var(--ok); color: #fff; border-color: var(--ok); }
  .keep[data-on="0"] { background: var(--no); color: #fff; border-color: var(--no); }
  .unheard { color: var(--no); font-size: 11px; margin-left: 6px; }
  #save { padding: 11px 20px; font-size: 15px; font-weight: 600; background: var(--acc);
          color: #fff; border: 0; border-radius: 8px; }
  #msg { margin-left: 12px; font-size: 13px; color: var(--mut); }
  @media (prefers-color-scheme: dark) {
    :root { --bd:#374151; --mut:#9ca3af; }
    body { background: #0f1115; color: #e5e7eb; }
    .head { background: #0f1115; }
    .note b { color: #e5e7eb; }
    tr.cur td { background: #172554; }
    button { background: #1f2430; color: #e5e7eb; }
  }
</style>

<div class="head">
  <h1>Chốt gold set</h1>
  <div class="note">
    Gold <b>không phải "đáp án đúng"</b> — nhãn của bạn không phải sự thật nền độc lập.
    Gold = <b>dễ tới mức ai nghe nghiêm túc cũng ra thế</b>, để bắt annotator
    <b>không nghe</b>, không phải để bắt người <b>nghe khác</b>.
    Clip nào phải ngẫm mới quyết được → <b>loại</b>.
  </div>
  <div class="note">
    <kbd>Space</kbd> nghe · <kbd>K</kbd> giữ · <kbd>D</kbd> loại · <kbd>J</kbd>/<kbd>N</kbd> xuống ·
    <kbd>↑</kbd> lên
  </div>
  <div class="counts" id="counts">…</div>
  <div style="margin-top:10px"><button id="save">Ghi gold-set.txt</button><span id="msg"></span></div>
</div>

<table><tbody id="rows"></tbody></table>
<script type="module" src="gold.js"></script>
