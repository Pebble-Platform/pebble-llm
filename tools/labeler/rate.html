<!doctype html>
<meta charset="utf-8">
<title>Gán nhãn cảm xúc — ViEmoSpeech</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bd:#d5d8dc; --mut:#6b7280; --acc:#2563eb; }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 system-ui, "Segoe UI", sans-serif; margin: 0; padding: 24px 16px 48px;
         max-width: 720px; margin-inline: auto; color: #111; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .bar { display: flex; justify-content: space-between; align-items: baseline;
         border-bottom: 1px solid var(--bd); padding-bottom: 10px; margin-bottom: 22px; }
  .who { color: var(--mut); font-size: 13px; }
  #play { width: 100%; padding: 26px; font-size: 18px; font-weight: 600; cursor: pointer;
          border: 2px solid var(--acc); background: #eff6ff; color: var(--acc);
          border-radius: 10px; }
  #play:active { background: #dbeafe; }
  .hint { color: var(--mut); font-size: 13px; text-align: center; margin: 8px 0 22px; }
  fieldset { border: 1px solid var(--bd); border-radius: 8px; margin: 0 0 18px; padding: 12px 14px; }
  legend { font-weight: 600; font-size: 13px; padding: 0 6px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opts button { flex: 1 1 120px; padding: 12px 8px; font-size: 14px; cursor: pointer;
                 border: 1px solid var(--bd); background: #fff; border-radius: 7px; }
  .opts button:hover { border-color: var(--acc); }
  .opts button[aria-pressed="true"] { background: var(--acc); color: #fff; border-color: var(--acc); }
  .opts button kbd { opacity: .55; font-size: 11px; margin-left: 4px; }
  .scale { display: flex; gap: 8px; }
  .scale button { flex: 1; padding: 12px 0; font-size: 15px; }
  .ends { display: flex; justify-content: space-between; color: var(--mut);
          font-size: 12px; margin-top: 5px; }
  #send { width: 100%; padding: 15px; font-size: 16px; font-weight: 600; cursor: pointer;
          border: 0; border-radius: 8px; background: #16a34a; color: #fff; }
  #send:disabled { background: #cbd5e1; cursor: not-allowed; }
  #skip { width: 100%; margin-top: 10px; padding: 10px; cursor: pointer; font-size: 13px;
          border: 1px solid var(--bd); background: #fff; border-radius: 8px; color: var(--mut); }
  #skipbox { display: none; margin-top: 10px; }
  #msg { text-align: center; padding: 40px 0; font-size: 16px; }
  @media (prefers-color-scheme: dark) {
    :root { --bd:#374151; --mut:#9ca3af; }
    body { background: #0f1115; color: #e5e7eb; }
    #play { background: #172554; }
    .opts button, #skip, #skipbox select { background: #1f2430; color: #e5e7eb; }
  }
</style>

<div class="bar">
  <h1>Gán nhãn cảm xúc</h1>
  <span class="who" id="who">…</span>
</div>

<div id="app" hidden>
  <button id="play">▶ Nghe</button>
  <div class="hint">Phím <kbd>Space</kbd> để nghe lại · nghe bao nhiêu lần cũng được</div>

  <fieldset>
    <legend>Cảm xúc nghe thấy</legend>
    <div class="opts" id="emo"></div>
  </fieldset>

  <fieldset>
    <legend>Valence — tiêu cực ↔ tích cực</legend>
    <div class="scale" id="val"></div>
    <div class="ends"><span>1 · rất tiêu cực</span><span>rất tích cực · 5</span></div>
  </fieldset>

  <fieldset>
    <legend>Arousal — bình lặng ↔ kích động</legend>
    <div class="scale" id="aro"></div>
    <div class="ends"><span>1 · rất bình lặng</span><span>rất kích động · 5</span></div>
  </fieldset>

  <button id="send" disabled>Gửi &amp; clip tiếp theo (Enter)</button>
  <button id="skip">⊘ Clip này không dùng được</button>
  <div id="skipbox">
    <select id="skipwhy">
      <option value="unclear">không nghe rõ (ồn/nhạc/méo/quá nhỏ)</option>
      <option value="multi_speaker">có từ 2 người nói</option>
      <option value="bad_cut">cắt hỏng (cụt đầu/cuối)</option>
      <option value="no_speech">không có tiếng nói</option>
    </select>
    <button id="skipgo" style="width:100%;margin-top:8px;padding:10px;cursor:pointer">
      Xác nhận bỏ qua
    </button>
  </div>
</div>

<div id="msg">Đang tải…</div>
<script type="module" src="rate.js"></script>
