<!doctype html>
<meta charset="utf-8">
<title>So nhãn nhiều người — ViEmoSpeech</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bd:#d5d8dc; --mut:#6b7280; --acc:#2563eb; --warn:#b45309; --no:#dc2626; }
  * { box-sizing: border-box; }
  body { font: 14px/1.45 system-ui, "Segoe UI", sans-serif; margin: 0 auto; padding: 18px 16px 64px;
         max-width: 1200px; color: #111; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .warn { background: #fffbeb; border: 1px solid #fcd34d; color: var(--warn);
          padding: 9px 12px; border-radius: 7px; font-size: 13px; margin-bottom: 12px; }
  .head { position: sticky; top: 0; background: #fff; padding-bottom: 10px; z-index: 2;
          border-bottom: 1px solid var(--bd); margin-bottom: 12px; }
  .counts { font-size: 13px; color: var(--mut); margin: 8px 0; }
  .counts b { color: #111; }
  .filters button { margin-right: 6px; }
  button { cursor: pointer; border: 1px solid var(--bd); background: #fff; border-radius: 6px;
           padding: 5px 11px; font-size: 13px; }
  button[aria-pressed="true"] { background: var(--acc); color: #fff; border-color: var(--acc); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 720px; }
  th { text-align: left; font-size: 12px; color: var(--mut); font-weight: 600;
       padding: 6px; border-bottom: 1px solid var(--bd); }
  td { border-bottom: 1px solid var(--bd); padding: 6px; vertical-align: top; }
  td.key { font-family: ui-monospace, monospace; font-size: 11px; color: var(--mut); }
  .cell b { font-weight: 600; }
  .cell .va { color: var(--mut); font-size: 11px; }
  .diff b { color: var(--no); }
  .skip { color: var(--warn); font-style: italic; font-size: 12px; }
  .dup { display: block; border-top: 1px dotted var(--bd); margin-top: 3px; padding-top: 3px; }
  .maj { font-weight: 600; }
  .maj.none { color: var(--no); }
  .tag { font-size: 10px; border: 1px solid var(--bd); border-radius: 4px;
         padding: 0 4px; color: var(--mut); margin-left: 4px; }
  tr.una { background: rgba(22,163,74,.06); }
  @media (prefers-color-scheme: dark) {
    :root { --bd:#374151; --mut:#9ca3af; }
    body { background: #0f1115; color: #e5e7eb; }
    .head { background: #0f1115; }
    .warn { background: #2a2410; border-color: #78551a; color: #fcd34d; }
    button { background: #1f2430; color: #e5e7eb; }
    .counts b { color: #e5e7eb; }
    tr.una { background: rgba(22,163,74,.10); }
  }
</style>

<div class="head">
  <h1>So nhãn nhiều người</h1>
  <div class="warn">
    Dùng <b>sau khi đóng vòng</b>. Xem nhãn của annotator trong lúc họ đang làm rồi lỡ
    góp ý về nội dung là <b>neo nhãn</b> — κ đo được sẽ vô nghĩa. Phản hồi khi vòng
    đang chạy chỉ được theo tiêu chí khách quan của qc-protocol §4.
  </div>
  <div class="filters">
    <button data-f="all" aria-pressed="true">tất cả</button>
    <button data-f="diff" aria-pressed="false">chỉ bất đồng</button>
    <button data-f="none" aria-pressed="false">no_agreement</button>
    <button data-f="skip" aria-pressed="false">có bỏ qua</button>
    <button data-f="dup" aria-pressed="false">clip lặp</button>
  </div>
  <div class="counts" id="counts">…</div>
</div>

<div class="scroll"><table>
  <thead id="thead"></thead>
  <tbody id="rows"></tbody>
</table></div>
<script type="module" src="review.js"></script>
