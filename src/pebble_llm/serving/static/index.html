<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pebble Voice Affect — Demo</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1f242e; --line: #2a313d;
    --txt: #e6e9ef; --muted: #98a2b3; --accent: #6ea8fe; --good: #3ddc97;
    --warn: #ffb454; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  #status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  #status-dot.ok { background: var(--good); }
  #status-dot.err { background: var(--bad); }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 14px; }
  .samples { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .sample {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    cursor: pointer; transition: border-color .12s, transform .12s;
  }
  .sample:hover { border-color: var(--accent); }
  .sample.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .sample .label { font-weight: 600; text-transform: capitalize; }
  .sample .sub { color: var(--muted); font-size: 11px; margin-top: 2px; word-break: break-all; }
  .sample audio { width: 100%; margin-top: 8px; height: 32px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button.run {
    background: var(--accent); color: #0b1020; border: 0; border-radius: 9px;
    padding: 11px 18px; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  button.run:disabled { opacity: .45; cursor: not-allowed; }
  .upload { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-style: italic; }
  .result-empty { color: var(--muted); display: flex; align-items: center; justify-content: center; min-height: 240px; }
  .verdict { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .verdict .emo { font-size: 30px; font-weight: 800; text-transform: capitalize; }
  .match { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); }
  .match.hit { color: var(--good); border-color: var(--good); }
  .match.miss { color: var(--warn); border-color: var(--warn); }
  .bars { display: grid; gap: 6px; margin: 8px 0 18px; }
  .bar-row { display: grid; grid-template-columns: 78px 1fr 46px; align-items: center; gap: 8px; }
  .bar-row .name { text-transform: capitalize; color: var(--muted); font-size: 12px; }
  .bar-track { background: var(--panel2); border-radius: 6px; height: 14px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width .35s; }
  .bar-row.top .name { color: var(--txt); font-weight: 600; }
  .bar-row.top .bar-fill { background: var(--good); }
  .bar-row .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .distress { border-top: 1px solid var(--line); padding-top: 14px; }
  .distress .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .flag { font-weight: 700; padding: 4px 12px; border-radius: 999px; font-size: 12px; }
  .flag.safe { color: var(--good); background: rgba(61,220,151,.12); }
  .flag.alert { color: var(--bad); background: rgba(255,107,107,.14); }
  .gauge-track { background: var(--panel2); border-radius: 6px; height: 18px; position: relative; overflow: hidden; }
  .gauge-fill { height: 100%; transition: width .35s; }
  .gauge-thr { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--txt); opacity: .7; }
  .gauge-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 5px; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>🪨 Pebble Voice Affect</h1>
  <span class="meta"><span id="status-dot"></span><span id="status-text">connecting…</span></span>
</header>

<main>
  <section class="card">
    <h2>1 · Choose a sample</h2>
    <div id="samples" class="samples"><span class="empty">loading samples…</span></div>
    <div class="row" style="margin-top:16px; justify-content:space-between;">
      <label class="upload">…or upload a wav: <input id="file" type="file" accept="audio/*" /></label>
      <button id="run" class="run" disabled>Run model</button>
    </div>
  </section>

  <section class="card">
    <h2>2 · Model response</h2>
    <div id="result"><div class="result-empty">Pick a sample and press <b>&nbsp;Run model</b></div></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let samples = [], selected = null, selectedFile = null;

const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;
const pct = (x) => (x * 100).toFixed(1) + "%";

async function init() {
  try {
    const h = await (await fetch("/health")).json();
    $("#status-dot").className = "ok";
    $("#status-text").textContent = `${h.backbone} · ${h.emotions.length} emotions · distress thr ${h.threshold.toFixed(2)}`;
  } catch (e) {
    $("#status-dot").className = "err";
    $("#status-text").textContent = "model not loaded — is the server up?";
  }
  await loadSamples();
}

async function loadSamples() {
  samples = await (await fetch("/api/samples")).json();
  const box = $("#samples");
  if (!samples.length) { box.innerHTML = '<span class="empty">no samples found in VOICE_SAMPLES dir</span>'; return; }
  box.innerHTML = "";
  samples.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "sample";
    el.dataset.i = i;
    el.innerHTML = `
      <div class="label">${cap(s.trueLabel || "sample")}</div>
      <div class="sub">${s.name}</div>
      <audio controls preload="none" src="${s.url}"></audio>`;
    el.addEventListener("click", (ev) => { if (ev.target.tagName !== "AUDIO") select(i); });
    box.appendChild(el);
  });
}

function select(i) {
  selected = samples[i]; selectedFile = null; $("#file").value = "";
  document.querySelectorAll(".sample").forEach((e) => e.classList.toggle("sel", +e.dataset.i === i));
  $("#run").disabled = false;
}

$("#file").addEventListener("change", (e) => {
  selectedFile = e.target.files[0] || null;
  if (selectedFile) {
    selected = null;
    document.querySelectorAll(".sample").forEach((e) => e.classList.remove("sel"));
    $("#run").disabled = false;
  }
});

$("#run").addEventListener("click", async () => {
  $("#run").disabled = true;
  $("#result").innerHTML = '<div class="result-empty"><div class="spinner"></div>&nbsp;running WavLM-Large…</div>';
  try {
    let res;
    if (selectedFile) {
      const fd = new FormData(); fd.append("file", selectedFile);
      res = await fetch("/api/classify", { method: "POST", body: fd });
    } else {
      res = await fetch(`/api/classify-sample?name=${encodeURIComponent(selected.name)}`, { method: "POST" });
    }
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    render(await res.json());
  } catch (e) {
    $("#result").innerHTML = `<div class="result-empty" style="color:var(--bad)">Error: ${e.message}</div>`;
  } finally {
    $("#run").disabled = false;
  }
});

function render(r) {
  const truth = selected ? selected.trueLabel : null;
  const entries = Object.entries(r.emotionProbs).sort((a, b) => b[1] - a[1]);
  const max = entries[0][1] || 1;
  let matchBadge = "";
  if (truth) {
    const hit = truth === r.detectedEmotion;
    matchBadge = `<span class="match ${hit ? "hit" : "miss"}">${hit ? "✓ matches label" : "✗ label: " + cap(truth)}</span>`;
  }
  const bars = entries.map(([name, p], i) => `
    <div class="bar-row ${i === 0 ? "top" : ""}">
      <span class="name">${cap(name)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(p / max * 100).toFixed(1)}%"></span></span>
      <span class="pct">${pct(p)}</span>
    </div>`).join("");

  const thr = window.__thr ?? 0.69;
  const d = r.distressScore;
  const gaugeColor = r.safetyFlag ? "var(--bad)" : "var(--good)";
  $("#result").innerHTML = `
    <div class="verdict">
      <div class="emo">${cap(r.detectedEmotion)}</div>
      ${matchBadge}
    </div>
    <div class="bars">${bars}</div>
    <div class="distress">
      <div class="head">
        <span style="color:var(--muted)">Distress / safety head</span>
        <span class="flag ${r.safetyFlag ? "alert" : "safe"}">${r.safetyFlag ? "⚠ SAFETY FLAG" : "✓ safe"}</span>
      </div>
      <div class="gauge-track">
        <span class="gauge-fill" style="width:${(d * 100).toFixed(1)}%; background:${gaugeColor}"></span>
        <span class="gauge-thr" style="left:${(thr * 100).toFixed(1)}%"></span>
      </div>
      <div class="gauge-meta">
        <span>distress ${d.toFixed(3)}</span>
        <span>threshold ${thr.toFixed(2)}</span>
        <span>backbone: ${r.backbone}</span>
      </div>
    </div>`;
}

fetch("/health").then(r => r.json()).then(h => { window.__thr = h.threshold; }).catch(() => {});
init();
</script>
</body>
</html>
